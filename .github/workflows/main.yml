name: Build and Deploy C# App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.100' 

    - name: Push to Private NuGet Registry
      env:
        NGINX_USERNAME: ${{ secrets.NGINX_USER }}
        NGINX_PASSWORD: ${{ secrets.NGINX_PASSWORD }}
        NUGET_SECRET_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        # Check if the package source 'PrivateRegistry' is already registered on this self-hosted runner
        if dotnet nuget list source | grep -Fq "PrivateRegistry"; then
          echo "Source 'PrivateRegistry' already exists. Updating credentials..."
          dotnet nuget update source "PrivateRegistry" \
            --source "https://nuget.lodewykroux.co.za/v3/index.json" \
            --username "$NGINX_USERNAME" \
            --password "$NGINX_PASSWORD" \
            --store-password-in-clear-text
        else
          echo "Source 'PrivateRegistry' not found. Adding fresh source..."
          dotnet nuget add source "https://nuget.lodewykroux.co.za/v3/index.json" \
            --name "PrivateRegistry" \
            --username "$NGINX_USERNAME" \
            --password "$NGINX_PASSWORD" \
            --store-password-in-clear-text
        fi

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish Application
      run: |
        dotnet publish -c Release -o ./publish /p:UseAppHost=false

    - name: Copy files to VM via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "./publish/*"
        target: "/var/www/html/isotainer-api" # Replace with your target folder path on the VM
        strip_prefix: "publish"

    - name: Execute remote commands via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # Example: Restart Systemd service or system process
          sudo systemctl restart myapp.service
